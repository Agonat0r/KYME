name: ML Pipeline

on:
  pull_request:
    paths:
      - 'server/**'
      - 'scripts/ml_prompt_smoke.py'
      - 'dvc.yaml'
      - 'params.yaml'
      - '.github/workflows/ml-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prompt-model-smoke:
    name: DVC CML MLflow Prompt Model Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ML automation tools
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn mlflow dvc
          npm install -g @dvcorg/cml

      - name: Reproduce DVC prompt-model stage
        env:
          MLFLOW_TRACKING_URI: file:mlruns
        run: dvc repro --no-commit prompt_model_smoke

      - name: Publish CML report to pull request
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create reports/ml/prompt_smoke_report.md

      - name: Upload ML artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-model-smoke
          path: |
            reports/ml/**
            artifacts/ml/**
            mlruns/**

