name: Browser Smoke

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'server/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright Signal UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser test runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start KYMA server
        run: |
          PYTHONPATH="$PWD/server" python -m uvicorn server.main:app --host 127.0.0.1 --port 8007 > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8007/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run Playwright smoke
        env:
          KYMA_BASE_URL: http://127.0.0.1:8007
        run: npm run test:e2e

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            output/playwright/**
            output/playwright-report/**
            test-results/**
            server.log

